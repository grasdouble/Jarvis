name: Self-improvement proposal
description: Describe one evidence-backed improvement to JARVIS itself.
labels:
  - kind:self-improvement
body:
  - type: markdown
    attributes:
      value: Write in English. This form tracks an actual improvement proposal, not implementation of the self-improvement mechanism in J7. Select the native Self-improvement milestone before submission; if unavailable, a maintainer must assign it during triage. A body reference does not assign metadata. This proposal grants no execution, promotion or activation authority.
  - type: textarea
    id: evidence
    attributes:
      label: Problem and sourced observations
      description: Give observed impact, sanitized reproduction, evidence links or IDs, time window and relevant revisions. Separate facts from estimates; explicitly identify missing measurements.
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: Improvement hypothesis
      description: State one falsifiable improvement claim, the proposed approach and what would refute it. Search for an existing proposal first.
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Baseline, target and uncertainty
      description: Identify deployed incumbent S and measurements, proposed gain and quality/security guardrails, target main B and evaluation profile if known. Mark unknown values rather than inventing evidence or thresholds.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and dependencies
      description: Define included paths/outcomes, exclusions, candidate task slices and genuine prerequisite issues. Do not bundle unrelated improvements.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and comparison plan
      description: Provide measurable criteria, regression checks, fixed comparison protocol and evidence sufficiency. Main promotion requires current human approval and independent review; activation is separate.
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Limits and decision owner
      description: Reference accepted or proposed size, attempts, time, token/currency and resource limits and the responsible owner. Missing accepted limits prevent execution; do not grant yourself a budget.
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: Risks, stop conditions and recovery
      description: Describe functional/security/data risks and feasible recovery, including migration compatibility and separate activation acceptance. Identify unknowns requiring a decision.
    validations:
      required: true
  - type: textarea
    id: tracking
    attributes:
      label: Proposal identity and related work
      description: Link prior proposals, source/deduplication identity if supplied, campaign/root and existing PRs or explain that none exists. The controller must reconcile remote state before retrying creation; there is at most one active promotion PR per improvement.
    validations:
      required: true
