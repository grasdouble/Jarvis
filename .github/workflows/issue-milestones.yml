name: Issue milestone audit

on:
  issues:
    types: [opened, reopened, milestoned, demilestoned]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: issue-milestones
  cancel-in-progress: true

jobs:
  audit:
    name: Every issue has a native milestone
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grasdouble/Jarvis
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Fetch every open and closed issue page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET --paginate --slurp \
            'repos/grasdouble/Jarvis/issues?state=all&per_page=100' \
            > "${RUNNER_TEMP}/issue-inventory.json"
      - name: Audit native milestones
        run: node .agents/skills/jarvis-project-management/scripts/github/check-issue-milestones.mjs "${RUNNER_TEMP}/issue-inventory.json"
