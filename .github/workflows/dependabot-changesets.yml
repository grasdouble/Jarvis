name: Dependabot changesets

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dependabot-changesets-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changeset:
    if: >-
      github.repository == 'grasdouble/Jarvis' &&
      vars.DEPENDABOT_CHANGESET_ENABLED == 'true' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.repo.full_name == 'grasdouble/Jarvis' &&
      github.event.pull_request.head.repo.full_name == 'grasdouble/Jarvis' &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify current Dependabot PR facts
        env:
          API_URL: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          repository = os.environ['GITHUB_REPOSITORY']
          if repository != 'grasdouble/Jarvis':
              raise SystemExit('Unexpected repository; refusing Dependabot write automation.')
          url = f"{os.environ['API_URL']}/repos/{repository}/pulls/{os.environ['PR_NUMBER']}"
          request = Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
          })
          try:
              with urlopen(request, timeout=10) as response:
                  pull = json.load(response)
          except (HTTPError, URLError, TimeoutError) as error:
              status = getattr(error, 'code', 'transport failure')
              raise SystemExit(f'Unable to verify current Dependabot PR facts ({status}).') from None

          base = pull.get('base') or {}
          head = pull.get('head') or {}
          base_repository = base.get('repo') or {}
          head_repository = head.get('repo') or {}
          actual = {
              'state': pull.get('state'),
              'author': (pull.get('user') or {}).get('login'),
              'base_repository': base_repository.get('full_name'),
              'head_repository': head_repository.get('full_name'),
              'base_ref': base.get('ref'),
              'head_ref': head.get('ref'),
              'base_sha': base.get('sha'),
              'head_sha': head.get('sha'),
          }
          expected = {
              'state': 'open',
              'author': 'dependabot[bot]',
              'base_repository': repository,
              'head_repository': repository,
              'base_ref': os.environ['EXPECTED_BASE_REF'],
              'head_ref': os.environ['EXPECTED_HEAD_REF'],
              'base_sha': os.environ['EXPECTED_BASE_SHA'],
              'head_sha': os.environ['EXPECTED_HEAD_SHA'],
          }
          if expected['base_ref'] != 'main' or not expected['head_ref'].startswith('dependabot/'):
              raise SystemExit('PR target or branch is outside the Dependabot allowlist.')
          if actual != expected:
              raise SystemExit('Current PR facts differ from the event; refusing a stale or ineligible run.')
          print(f"Verified open Dependabot PR #{os.environ['PR_NUMBER']} at its current head.")
          PY

      - name: Checkout Dependabot head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted base workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: grasdouble/Jarvis
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          fetch-depth: 1
          persist-credentials: false

      - name: Move trusted base outside candidate checkout
        env:
          TRUSTED_BASE: ${{ github.workspace }}/trusted-base
        run: |
          set -euo pipefail
          trusted_base="$RUNNER_TEMP/jv034-trusted-base"
          test ! -e "$trusted_base"
          mv "$TRUSTED_BASE" "$trusted_base"
          echo "JARVIS_TRUSTED_BASE=$trusted_base" >> "$GITHUB_ENV"

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Install pinned PNPM without reading candidate configuration
        working-directory: ${{ runner.temp }}/jv034-trusted-base
        run: npm install --global pnpm@12.5.1

      - name: Route workspace discovery through trusted base files
        run: |
          set -euo pipefail
          real_pnpm="$(command -v pnpm)"
          wrapper_dir="$RUNNER_TEMP/jv034-bin"
          mkdir -p "$wrapper_dir"
          cat > "$wrapper_dir/pnpm" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec node "$JARVIS_TRUSTED_BASE/scripts/ci/dependabot_pnpm_workspaces.mjs" "$@"
          SH
          chmod 700 "$wrapper_dir/pnpm"
          echo "JARVIS_REAL_PNPM=$real_pnpm" >> "$GITHUB_ENV"
          echo "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Preflight Dependabot changeset
        id: preflight
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPENDABOT_CHANGESET_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node "$JARVIS_TRUSTED_BASE/scripts/ci/dependabot_changeset_preflight.mjs"

      - name: Report a deliberate no-op
        if: ${{ steps.preflight.outputs.affected != 'true' }}
        run: echo 'No versionable workspace package metadata changed; no Changeset or write token is needed.'

      - name: Check dedicated App provisioning
        if: ${{ steps.preflight.outputs.affected == 'true' }}
        env:
          APP_CLIENT_ID: ${{ vars.DEPENDABOT_CHANGESET_APP_CLIENT_ID }}
          APP_SLUG: ${{ vars.DEPENDABOT_CHANGESET_APP_SLUG }}
          INSTALLATION_ID: ${{ vars.DEPENDABOT_CHANGESET_APP_INSTALLATION_ID }}
          APP_PRIVATE_KEY: ${{ secrets.DEPENDABOT_CHANGESET_APP_PRIVATE_KEY }}
        run: |
          test -n "$APP_CLIENT_ID" || { echo '::error::DEPENDABOT_CHANGESET_APP_CLIENT_ID is not provisioned.'; exit 1; }
          test -n "$APP_SLUG" || { echo '::error::DEPENDABOT_CHANGESET_APP_SLUG is not provisioned.'; exit 1; }
          test -n "$INSTALLATION_ID" || { echo '::error::DEPENDABOT_CHANGESET_APP_INSTALLATION_ID is not provisioned.'; exit 1; }
          test -n "$APP_PRIVATE_KEY" || { echo '::error::DEPENDABOT_CHANGESET_APP_PRIVATE_KEY Dependabot secret is not provisioned.'; exit 1; }

      - name: Create scoped Dependabot App token
        id: app
        if: ${{ steps.preflight.outputs.affected == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.DEPENDABOT_CHANGESET_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_CHANGESET_APP_PRIVATE_KEY }}
          owner: grasdouble
          repositories: Jarvis
          permission-contents: write

      - name: Verify dedicated App identity
        id: identity
        if: ${{ steps.preflight.outputs.affected == 'true' }}
        env:
          EXPECTED_APP_SLUG: ${{ vars.DEPENDABOT_CHANGESET_APP_SLUG }}
          EXPECTED_INSTALLATION_ID: ${{ vars.DEPENDABOT_CHANGESET_APP_INSTALLATION_ID }}
          ACTUAL_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          ACTUAL_INSTALLATION_ID: ${{ steps.app.outputs.installation-id }}
        run: |
          test "$ACTUAL_APP_SLUG" = "$EXPECTED_APP_SLUG" || { echo '::error::The token belongs to an unexpected GitHub App.'; exit 1; }
          test "$ACTUAL_INSTALLATION_ID" = "$EXPECTED_INSTALLATION_ID" || { echo '::error::The token belongs to an unexpected installation.'; exit 1; }

      - name: Generate the Dependabot changeset
        if: ${{ steps.preflight.outputs.affected == 'true' && steps.identity.outcome == 'success' }}
        uses: grasdouble/Lufa-CICD/actions/dependabot-changeset@d13c591aef751743f19240acdc79b7e9cb0cfe1a
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          head-branch: ${{ github.event.pull_request.head.ref }}
          pull-request-number: ${{ github.event.pull_request.number }}
          github-token: ${{ steps.app.outputs.token }}
