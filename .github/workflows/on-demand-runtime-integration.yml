name: On-demand runtime integration qualification

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open pull request number to qualify
        required: true
        type: string
      expected_head_sha:
        description: Exact 40-character head SHA expected for that pull request
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: manual-runtime-integration-${{ inputs.pull_request }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify exact PR head
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: jarvis_ci
          POSTGRES_PASSWORD: jarvis_ci_fake_password
          POSTGRES_DB: jarvis_integration_manual
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis_ci -d jarvis_integration_manual"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_USER: jarvis_ci
      POSTGRES_PASSWORD: jarvis_ci_fake_password
      POSTGRES_DB: jarvis_integration_manual
      JARVIS_TEST_DATABASE_URL: postgres://jarvis_ci:jarvis_ci_fake_password@localhost:5432/jarvis_integration_manual
    steps:
      - name: Refuse non-default-branch or cross-repository dispatch before using a token
        env:
          DISPATCH_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          test "$DISPATCH_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$EVENT_REPOSITORY" = "$CURRENT_REPOSITORY"
      # This workflow definition and validation script come from the trusted default branch.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify PR and expected head against GitHub metadata
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
          EXPECTED_SHA: ${{ inputs.expected_head_sha }}
        run: |
          python3 scripts/ci/manual_integration_report.py validate \
            --pr "$PR_NUMBER" --sha "$EXPECTED_SHA" --token "$GH_TOKEN" --github-output "$GITHUB_OUTPUT"
      - name: Preserve trusted report helper outside candidate workspace
        run: cp scripts/ci/manual_integration_report.py "$RUNNER_TEMP/manual_integration_report.py"
      - name: Fetch exact validated candidate revision
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.head }}
          PR_NUMBER: ${{ inputs.pull_request }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pull/$PR_NUMBER/head"
          fetched_sha="$(git rev-parse "refs/remotes/pull/$PR_NUMBER/head^{commit}")"
          test "$fetched_sha" = "$CANDIDATE_SHA"
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pnpm
        id: pnpm
        continue-on-error: true
        env:
          GH_TOKEN: ''
        run: |
          python3 "$RUNNER_TEMP/manual_integration_report.py" record-command --output "$RUNNER_TEMP/setup-pnpm.json" -- npm install --global pnpm@12.5.1
      - name: Install workspace dependencies
        id: dependencies
        if: steps.pnpm.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ''
        run: python3 "$RUNNER_TEMP/manual_integration_report.py" record-command --output "$RUNNER_TEMP/setup-dependencies.json" -- pnpm install --frozen-lockfile
      - name: Build dependencies and run PostgreSQL-backed integration qualification
        id: tests
        continue-on-error: true
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          CANDIDATE_PR: ${{ steps.candidate.outputs.pr }}
          CANDIDATE_BASE: ${{ steps.candidate.outputs.base }}
          CANDIDATE_HEAD: ${{ steps.candidate.outputs.head }}
          JARVIS_RUN_STOP_RUNTIME_INTEGRATION: '1'
          JV265_RESTORE_GATE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          export JARVIS_SETUP_RESULTS="$(python3 -c 'import glob,json,os; print(json.dumps([json.load(open(p)) for p in sorted(glob.glob(os.environ["RUNNER_TEMP"] + "/setup-*.json"))]))')"
          python3 "$RUNNER_TEMP/manual_integration_report.py" run --pr "$CANDIDATE_PR" --base "$CANDIDATE_BASE" --head "$CANDIDATE_HEAD" --output "$RUNNER_TEMP/integration-report.json"
      - name: Add report to job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/integration-report.json" ]; then
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("# On-demand runtime integration report\n\n```json\n" + json.dumps(d, indent=2) + "\n```")' "$RUNNER_TEMP/integration-report.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# On-demand runtime integration report' >> "$GITHUB_STEP_SUMMARY"
            echo 'Qualification did not reach test execution; see preceding setup/validation failure.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: runtime-integration-report
          path: ${{ runner.temp }}/integration-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Fail qualification when tests failed or were skipped
        if: always() && steps.tests.outcome == 'failure'
        run: exit 1
