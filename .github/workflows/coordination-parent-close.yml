name: Close accepted coordination parents

on:
  issues:
    types: [edited, closed, reopened]

permissions:
  contents: read

jobs:
  close-parent:
    name: Re-evaluate native parent acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: grasdouble/Jarvis
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Re-evaluate the current issue and native parent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/close_coordination_parents.mjs
