name: Repository checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Repository configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      POSTGRES_USER: jarvis_ci
      POSTGRES_PASSWORD: jarvis_ci_fake_password
      POSTGRES_DB: jarvis_issue8_ci
      JARVIS_TEST_DATABASE_URL: postgres://jarvis_ci:jarvis_ci_fake_password@localhost:5432/jarvis_issue8_ci
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: jarvis_ci
          POSTGRES_PASSWORD: jarvis_ci_fake_password
          POSTGRES_DB: jarvis_issue8_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis_ci -d jarvis_issue8_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned validation dependency
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          python3 -m pip install --require-hashes --only-binary=:all: -r .github/requirements-ci.txt
      - name: Validate repository configuration and local documentation links
        run: python3 scripts/ci/check_repository.py
      - name: Exercise invalid configuration and title cases
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Test package release workflow contracts and reconciliation
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Test the PR-review validation workspace helper
        run: python3 .agents/skills/jarvis-review/scripts/test_prepare_validation_workspace.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test Dependabot Changeset API planning and commit safety
        run: node --test scripts/ci/dependabot_changeset_api.test.mjs
      - name: Install the pinned PNPM workspace manager
        run: npm install --global pnpm@12.5.1
      - name: Install the frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Changeset Process
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci/exercise_changeset_version_pr.py
      - name: Require Changesets for changed packages
        id: changeset-validation
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/ci/check_changeset_pr.py
          --pull-request-merge-base "$GITHUB_SHA"
          --workspace-head-sha "$PR_HEAD_SHA"
          --exclude-path '**/test/**'
          --exclude-path '**/tests/**'
          --exclude-path '**/__tests__/**'
          --exclude-path '**/*.test.*'
          --exclude-path '**/*.spec.*'
          --exclude-path '**/*.md'
          --exclude-path '**/*.adoc'
      - name: Checkout PR head for head-only workspace discovery
        if: github.event_name == 'pull_request' && steps.changeset-validation.outputs.generated-version-pr != 'true'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git checkout --detach "$PR_HEAD_SHA"
      - name: Check Changeset coverage with Lufa-CICD
        id: changeset-coverage
        if: github.event_name == 'pull_request' && steps.changeset-validation.outputs.generated-version-pr != 'true'
        uses: grasdouble/Lufa-CICD/actions/check-changesets@9e985a3bb7fd2892e1075bed1c87acd4c1f527d8
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          ignore-patterns: |
            **/test/**
            **/tests/**
            **/__tests__/**
            **/*.test.*
            **/*.spec.*
            **/*.md
            **/*.adoc
      - name: Restore PR merge candidate checkout
        if: always() && github.event_name == 'pull_request' && steps.changeset-validation.outputs.generated-version-pr != 'true'
        run: git checkout --detach "$GITHUB_SHA"
      - name: Fail when changed workspaces lack Changesets
        if: github.event_name == 'pull_request' && steps.changeset-validation.outputs.generated-version-pr != 'true' && steps.changeset-coverage.outputs.missing-count != '0'
        run: |
          echo "One or more changed workspaces are missing Changeset coverage."
          exit 1
      - name: Test the sandbox-manager contracts
        run: pnpm --filter @jarvis/sandbox-manager test
      - name: Test PostgreSQL persistence against the ephemeral database
        run: pnpm --filter @jarvis/persistence test
      - name: Test contributor GitHub tooling without real credentials
        run: node --test .agents/skills/jarvis-backlog/scripts/github/*.test.mjs

  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate the title without evaluating it as shell code
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os, re
          title = os.environ['PR_TITLE']
          pattern = r'(feat|fix|docs|refactor|test|build|ci|chore|perf|style|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: [^\r\n]+'
          if not re.fullmatch(pattern, title) or not title.split(': ', 1)[1].strip():
              raise SystemExit('Use an English Conventional Commits PR title; see AGENTS.md.')
          print('Conventional PR title passed.')
          PY
      - name: No PR title on this event
        if: github.event_name != 'pull_request'
        run: echo 'Title validation applies to pull requests.'

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify the pinned scanner
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Test secret-scan history scoping with the pinned scanner
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: python3 -m unittest discover -s scripts/ci -p 'test_scan_secrets.py'
      - name: Scan the required Git history with redacted findings
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/ci/scan_secrets.py
          --gitleaks "${RUNNER_TEMP}/gitleaks"
          --event-name "${GITHUB_EVENT_NAME}"
